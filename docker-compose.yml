version: '3.8'
services:
  frontend:
    image: node:16-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g http-server && cd public && http-server -p 8080 --cors -c-1"
    ports:
      - "8080:8080"
  worker:
    image: node:16-alpine
    working_dir: /app/workers
    volumes:
      - ./:/app
    environment:
      - API_KEY=${API_KEY:-demo_api_key}
      - KNOWLEDGE_API_KEY=${KNOWLEDGE_API_KEY:-demo_knowledge_key}
      - GCP_API_KEY=${GCP_API_KEY:-demo_gcp_key}
      - DATASET_ID=${DATASET_ID:-demo_dataset}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
    command: sh -c "npm install -g wrangler && node ../scripts/local-worker.js"
    ports:
      - "8787:8787"
