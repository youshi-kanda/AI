<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI面接官チャット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .settings-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
        }

        .character-area {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23f5f7fa"/><stop offset="100%" style="stop-color:%23c3cfe2"/></linearGradient><linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23ffeaa7"/><stop offset="100%" style="stop-color:%23fab1a0"/></linearGradient><linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23d4a574"/><stop offset="100%" style="stop-color:%23c49464"/></linearGradient></defs><rect width="800" height="600" fill="url(%23bg)"/><ellipse cx="400" cy="200" rx="120" ry="140" fill="url(%23skin)"/><ellipse cx="350" cy="180" rx="15" ry="20" fill="%23d4a574"/><ellipse cx="450" cy="180" rx="15" ry="20" fill="%23d4a574"/><ellipse cx="400" cy="220" rx="8" ry="12" fill="%23fab1a0"/><path d="M 380 240 Q 400 250 420 240" stroke="%23e17055" stroke-width="3" fill="none"/><ellipse cx="400" cy="120" rx="140" ry="100" fill="url(%23hair)"/><rect x="300" y="300" width="200" height="250" rx="20" fill="%230984e3"/><rect x="320" y="320" width="160" height="200" rx="10" fill="%23ffffff"/></svg>');
            background-size: cover;
            background-position: center;
        }

        .character-display {
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23ffeaa7"/><stop offset="100%" style="stop-color:%23fab1a0"/></linearGradient><linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%23d4a574"/><stop offset="100%" style="stop-color:%23c49464"/></linearGradient><linearGradient id="uniform" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%232d3436"/><stop offset="100%" style="stop-color:%23636e72"/></linearGradient></defs><ellipse cx="400" cy="200" rx="120" ry="140" fill="url(%23skin)"/><ellipse cx="350" cy="180" rx="15" ry="20" fill="%23d4a574"/><ellipse cx="450" cy="180" rx="15" ry="20" fill="%23d4a574"/><circle cx="345" cy="175" r="3" fill="%23000"/><circle cx="355" cy="175" r="3" fill="%23000"/><circle cx="445" cy="175" r="3" fill="%23000"/><circle cx="455" cy="175" r="3" fill="%23000"/><ellipse cx="400" cy="220" rx="8" ry="12" fill="%23fab1a0"/><path d="M 380 240 Q 400 250 420 240" stroke="%23e17055" stroke-width="3" fill="none"/><ellipse cx="400" cy="120" rx="140" ry="100" fill="url(%23hair)"/><rect x="300" y="300" width="200" height="250" rx="20" fill="url(%23uniform)"/><rect x="320" y="320" width="160" height="200" rx="10" fill="%23ffffff"/><rect x="340" y="340" width="120" height="20" fill="%23000"/></svg>') center/contain no-repeat;
            position: relative;
        }

        .speech-bubble {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            max-width: 80%;
            font-size: 16px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.5s ease-out;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid rgba(0, 0, 0, 0.8);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .typing-indicator {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .input-area {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .send-button::before {
            content: '→';
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .speech-bubble {
                max-width: 90%;
                padding: 15px 20px;
                font-size: 14px;
            }
            
            .input-area {
                padding: 15px;
            }
            
            .message-input {
                padding: 12px 16px;
                font-size: 14px;
            }
            
            .send-button {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="settings-button">設定 美咲</button>
        
        <div class="character-area">
            <div class="character-display"></div>
            <div class="speech-bubble" id="speechBubble">
                こんにちは！本日は貴重なお時間をいただき、ありがとうございます。リラックスして面接を進めましょう。
            </div>
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                面接官が入力中...
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="回答を入力してください..." />
            <button class="send-button" id="sendButton"></button>
        </div>
    </div>

    <script src="dify_integration.js"></script>
    <script>
        class ChatInterview {
            constructor() {
                this.speechBubble = document.getElementById('speechBubble');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.messages = [];
                this.currentMessageIndex = 0;
                
                // Initialize Dify API client
                // Note: In production, API key should be stored securely
                this.difyClient = new DifyAPIClient(
                    'app-tuSegwlvBnfJZrarg2DNKQST', // Actual Dify API key
                    'https://api.dify.ai/v1'        // Dify endpoint
                );
                
                this.init();
            }
            
            init() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });
                
                // Initialize with welcome message
                setTimeout(() => {
                    this.showInterviewerMessage('こんにちは！本日は貴重なお時間をいただき、ありがとうございます。リラックスして面接を進めましょう。');
                }, 1000);
            }
            
            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message) return;
                
                // Clear input and disable button
                this.messageInput.value = '';
                this.sendButton.disabled = true;
                
                // Show typing indicator
                this.showTypingIndicator();
                
                try {
                    // Get response from Dify API
                    const response = await this.difyClient.sendMessage(message);
                    
                    // Hide typing indicator
                    this.hideTypingIndicator();
                    
                    if (response.success) {
                        this.showInterviewerMessage(response.message);
                    } else {
                        // Fallback response if API fails
                        const fallbackResponses = [
                            'なるほど、興味深いですね。もう少し詳しく教えていただけますか？',
                            'それは素晴らしい経験ですね。その時に学んだことは何ですか？',
                            'とても良い回答です。次の質問に移らせていただきます。',
                            'あなたの考え方がよく分かりました。他に何かありますか？',
                            'ありがとうございます。それでは、あなたの技術的なスキルについて教えてください。',
                            'なるほど、それは貴重な経験ですね。チームワークについてはいかがですか？'
                        ];
                        const randomResponse = fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
                        this.showInterviewerMessage(randomResponse);
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    this.hideTypingIndicator();
                    this.showInterviewerMessage('すみません、システムエラーが発生しました。もう一度お試しください。');
                }
                
                this.sendButton.disabled = false;
            }
            
            showInterviewerMessage(message) {
                this.speechBubble.textContent = message;
                this.speechBubble.style.display = 'block';
                
                // Add animation
                this.speechBubble.style.animation = 'none';
                setTimeout(() => {
                    this.speechBubble.style.animation = 'fadeInUp 0.5s ease-out';
                }, 10);
            }
            
            showTypingIndicator() {
                this.speechBubble.style.display = 'none';
                this.typingIndicator.style.display = 'block';
            }
            
            hideTypingIndicator() {
                this.typingIndicator.style.display = 'none';
                this.speechBubble.style.display = 'block';
            }
        }
        
        // Initialize the chat when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatInterview();
        });
    </script>
</body>
</html>
